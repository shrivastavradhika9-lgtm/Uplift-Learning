services:
  api:
    build: .
    container_name: mds02-uplift-api
    ports:
      - "8000:8000"
    volumes:
      - ./results:/app/results
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  dashboard:
    build: .
    container_name: mds02-uplift-dashboard
    ports:
      - "8502:8501"
    command: streamlit run app/dashboard.py --server.address=0.0.0.0 --server.port=8501
    depends_on:
      - api